# LHRM Baseline — AAPD BCE control (ablation)
# All same as aapd_paper.yaml except loss=bce
# Used to isolate Focal Loss contribution (A9)

experiment_id: lhrm_baseline_aapd_L_bce_seed42_v1

dataset: aapd
data_dir: data/processed/AAPD
zip_path: Data/AAPD.zip
defs_path: Label_Definition/arxiv_labels_definitions.json
bert_name: bert-base-uncased
max_len: 256
hidden_size: 768
variant: L
separate_label_encoder: false
epochs: 15
batch_size: 8
lr: 2.0e-5
weight_decay: 0.01
seed: 42
use_amp: true
num_workers: 0

loss: bce                               # CONTROL (ablation vs focal)
focal_gamma: null
focal_alpha: null

gb_n_estimators: 100
gb_learning_rate: 0.1
gb_max_depth: 3
gb_subsample: 1.0
gb_criterion: friedman_mse
gb_loss: squared_error
gb_validation_fraction: 0.1
gb_tol: 1.0e-4

eval_k_values: [1, 3, 5]
bootstrap_n: 1000
out_dir: experiments/lhrm_baseline_aapd_L_bce_seed42_v1
checkpoint_dir: experiments/lhrm_baseline_aapd_L_bce_seed42_v1/checkpoints
label_mapping_status: UNVERIFIED_LABEL_MAPPING
