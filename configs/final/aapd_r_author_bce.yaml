# LHRM Baseline -- AAPD Author-Aligned Reference Recovery (Variant R_AUTHOR)
# Phase 1 Recovery: Client-Ready Author-Code-Aligned Implementation
# Architecture: R_AUTHOR (Concat CSAM with trainable label embeddings & pooler_output)
# Loss: bce (BCEWithLogitsLoss matching Model/lhrm.py)

experiment_id: lhrm_baseline_aapd_R_AUTHOR_bce_seed42_v1
run_id: AAPD_R_AUTHOR_BCE_RECOVERY_20261015_A

# Dataset (ZENODO SOURCE AS PROVIDED -- A_D1)
dataset: aapd
data_dir: data/processed/AAPD
zip_path: Data/AAPD.zip
defs_path: Label_Definition/arxiv_labels_definitions.json
label_mapping_status: UNRESOLVED_LABEL_MAPPING_ACCEPTED_BY_CLIENT_DECISION

# BERT (A14: REPOSITORY-DEFINED; paper says "BERT" without variant)
bert_model: bert-base-uncased
max_len: 512      # A10: BERT hard limit; NEA; head truncation only
hidden_size: 768  # Hidden size matching bert-base-uncased

# Architecture (Author-aligned CSAM with concatenation)
architecture: R_AUTHOR
variant: R_AUTHOR

# Training (PAPER-EXPLICIT training schedule: 15 epochs, batch size 8)
num_epochs: 15
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.01
seed: 42

# AMP (A11: ASSUMED; not in paper)
amp: true

# Loss: bce (Author repository reference: BCEWithLogitsLoss)
loss: bce

# HRRM (A13: PAPER-EXPLICIT; Section IV-D verbatim)
gb_n_estimators: 100
gb_learning_rate: 0.1
gb_max_depth: 3
gb_subsample: 1.0
gb_criterion: friedman_mse
gb_loss: squared_error
gb_n_iter_no_change: 10
gb_tol: 0.0001
gb_validation_fraction: 0.1
hrrm_fitting_data: dev_predictions

# Evaluation
eval_model: final_epoch
eval_k_values: [1, 3, 5]
bootstrap_n: 1000
bootstrap_seed: 42

# No scheduler, warm-up or gradient clipping (PAPER-ABSENT; NEA)
scheduler: null
warmup_steps: 0
max_grad_norm: null

# Tie-breaking (A16/A18: seeded-random)
tie_breaking: seeded_random
